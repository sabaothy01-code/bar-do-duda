.galeria {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
}

.foto {
  background: #211a15;
  padding: 8px;

}

.foto img {
  display: block;
  width: 100%;
  height: 360px;

.voltar {

}

.voltar a {
  display: inline-block;
  background: #c99a3d;
  color: #17120e;
  text-decoration: none;
  font-weight: bold;
  padding: 14px 25px;
  border-radius: 8px;
}

@media (max-width: 700px) {

  .galeria {
    grid-template-columns: 1fr;
  }

  .foto img {
    height: 300px;
  }

  header h1 {
    font-size: 30px;
  }
}
